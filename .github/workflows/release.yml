name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: powershell -ExecutionPolicy Bypass -File tools/build-release.ps1

      - name: Publish to Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # 删除该 tag 现有 release（含重打 tag 时 GitHub 自动恢复的旧版本安装包），再全新创建，
          # 保证 Release 只含本次构建产物、不残留旧版本号安装包
          gh release delete "$TAG" --repo "$REPO" --yes 2>/dev/null || true
          gh release create "$TAG" --repo "$REPO" tools/_dist/*.exe --generate-notes
